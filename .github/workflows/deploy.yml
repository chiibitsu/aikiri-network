name: deploy
# Ran once. The contract is live at 0x15eFF43a5CFA703215fAa943D42168aF5a7A6a9e and
# a second deploy is refused. Kept so the path is reviewable, and for the
# multi-signer v2 contract when members arrive.
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      rpc:
        description: Base RPC URL
        default: https://mainnet.base.org
        required: true
      chain_id:
        description: expected chainId
        default: "8453"
        required: true
      adopt_only:
        description: only record a contract this wallet already deployed; never send
        type: boolean
        default: false
permissions:
  contents: write
concurrency: ledger-write
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install, pinned by hash
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: pinned solc
        run: |
          mkdir -p ~/.solcx
          curl -sSL -o ~/.solcx/solc-v0.8.26 \
            https://github.com/ethereum/solidity/releases/download/v0.8.26/solc-static-linux
          echo "d5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef  $HOME/.solcx/solc-v0.8.26" \
            | sha256sum -c -
          chmod +x ~/.solcx/solc-v0.8.26
      - name: deploy
        env:
          BASE_PRIVATE_KEY: ${{ secrets.BASE_PRIVATE_KEY }}
          RPC: ${{ inputs.rpc }}
          CHAIN_ID: ${{ inputs.chain_id }}
          ADOPT_ONLY: ${{ inputs.adopt_only }}
        run: |
          test -n "$BASE_PRIVATE_KEY" || { echo "secret BASE_PRIVATE_KEY is not set"; exit 1; }
          FLAGS=""
          [ "$ADOPT_ONLY" = "true" ] && FLAGS="--adopt-only"
          aikiri-ledger deploy --rpc "$RPC" --chain-id "$CHAIN_ID" $FLAGS
      - name: commit the deployment record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/config.json ledger/deploy.json
          git commit -m "Record the AikiriLedger deployment"
          git push origin HEAD:main
