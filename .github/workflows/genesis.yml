name: genesis
# Ran once, on 2 September 2026. Block 0 exists and is anchored; this workflow
# refuses to run again. Kept as the record of how the network began.
on:
  push:
    branches: [main]
    paths: [".github/workflows/genesis.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: ledger-write
jobs:
  genesis:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install, pinned by hash
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: refuse if a genesis already exists
        run: test ! -e ledger/blocks/000000.json || { echo "the network already has block 0"; exit 1; }
      - name: init
        env:
          AIKIRI_VALIDATOR_KEY: ${{ secrets.AIKIRI_VALIDATOR_KEY }}
        run: |
          test -n "$AIKIRI_VALIDATOR_KEY" || { echo "secret AIKIRI_VALIDATOR_KEY is not set"; exit 1; }
          aikiri-ledger init --keyfile /nonexistent
      - name: commit block 0
        run: |
          HASH=$(python -c "import json;print(json.load(open('ledger/blocks/000000.json'))['hash'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/blocks/000000.json ledger/HEAD
          git commit --author="Angeline S. Viray <chii@chiibitsu.com>" -m "Genesis: block 0 of the Aikiri Network ($HASH)"
          git push origin HEAD:main
