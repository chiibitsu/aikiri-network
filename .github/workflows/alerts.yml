name: alerts
# Telegram messages to Chii about this repository's runs on main: when a block run is
# requested (it then waits for her approval of the ledger environment, or queues
# behind another ledger run first), and when a run of block, nightly, tests, deploy or
# genesis fails or is cancelled (GitHub drops a pending run from the ledger queue when
# a newer one arrives, so a block that said it was waiting can end that way). block.yml itself is untouched, so an alert can never hold a block or
# change how its run ends.
# A message carries only fixed words, the workflow's name and result, and the run's
# link: never a branch name, a commit message or anything else someone else could write.
# The bot token and chat id (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) are secrets of the
# `alerts` environment, limited to main and with no reviewer: repository secrets would
# reach any workflow a writer pushes on any branch. With either unset an alert is
# skipped and its job passes, but a manual run (a test message) fails, so it cannot
# look like it worked.
on:
  workflow_run:
    workflows: [block, nightly, tests, deploy, genesis]
    types: [requested, completed]
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  waiting:
    # Only this repository's own runs on main (workflow_run matches by name, so a fork's
    # pull request or a branch could otherwise add its own workflow named `block`).
    if: >-
      github.event_name == 'workflow_run'
      && github.event.action == 'requested'
      && github.event.workflow_run.name == 'block'
      && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    environment: alerts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: tell Chii a block is waiting for her approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "aikiri-network: a block was requested and needs your approval (it may queue behind another ledger run first). ${{ github.event.workflow_run.html_url }}"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; no alert sent."
            exit 0
          fi
          reply=$(mktemp)
          if ! curl -sS --fail-with-body --max-time 20 -o "$reply" -w "Telegram answered HTTP %{http_code}\n" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              --data-urlencode "disable_web_page_preview=true"; then
            if [ -s "$reply" ]; then
              echo "Telegram's reply: $(head -c 300 "$reply")"  # its reason, e.g. "chat not found"
            else
              echo "No reply from Telegram (curl's error is above)."
            fi
            exit 1
          fi
  failed:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.action == 'completed'
      && contains(fromJSON('["failure", "timed_out", "startup_failure", "cancelled"]'), github.event.workflow_run.conclusion)
      && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    environment: alerts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: tell Chii on Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "aikiri-network: ${{ github.event.workflow_run.name }} ${{ github.event.workflow_run.conclusion }}. ${{ github.event.workflow_run.html_url }}"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; no alert sent."
            exit 0
          fi
          reply=$(mktemp)
          if ! curl -sS --fail-with-body --max-time 20 -o "$reply" -w "Telegram answered HTTP %{http_code}\n" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              --data-urlencode "disable_web_page_preview=true"; then
            if [ -s "$reply" ]; then
              echo "Telegram's reply: $(head -c 300 "$reply")"  # its reason, e.g. "chat not found"
            else
              echo "No reply from Telegram (curl's error is above)."
            fi
            exit 1
          fi
  test:
    if: github.event_name == 'workflow_dispatch'
    environment: alerts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: the secrets are set
        # A test with nothing to send must not look like one that worked.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "the alerts environment's secret TELEGRAM_BOT_TOKEN is not set"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "the alerts environment's secret TELEGRAM_CHAT_ID is not set"; exit 1; }
      - name: send a test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "aikiri-network: alerts are on. You will hear here when a block waits for your approval or a run on main fails or is cancelled."
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; no alert sent."
            exit 0
          fi
          reply=$(mktemp)
          if ! curl -sS --fail-with-body --max-time 20 -o "$reply" -w "Telegram answered HTTP %{http_code}\n" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              --data-urlencode "disable_web_page_preview=true"; then
            if [ -s "$reply" ]; then
              echo "Telegram's reply: $(head -c 300 "$reply")"  # its reason, e.g. "chat not found"
            else
              echo "No reply from Telegram (curl's error is above)."
            fi
            exit 1
          fi
