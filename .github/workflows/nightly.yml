name: nightly
# No longer writes anything. Blocks are written only when Chii approves a request
# on one of her devices, so there is nothing for a schedule to sign. What is left
# is worth doing nightly: fetch completed Bitcoin proofs, re-verify the whole
# chain against Base, and say plainly which of the four states it is in.
on:
  schedule:
    - cron: "0 16 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/nightly.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: ledger-write
jobs:
  witness:
    runs-on: ubuntu-latest
    environment: ledger-readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install, pinned by hash
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install --no-deps opentimestamps-client opentimestamps
      - name: upgrade pending Bitcoin proofs
        run: aikiri-ledger upgrade || true
      - name: commit any proof that completed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ledger/proofs
          git diff --cached --quiet || {
            git commit -m "Bitcoin proofs upgraded"
            git push origin HEAD:main
          }
      - name: verify and report the state
        run: aikiri-ledger verify --trust trust.json --require local | tee -a "$GITHUB_STEP_SUMMARY"
