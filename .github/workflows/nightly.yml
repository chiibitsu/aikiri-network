name: nightly
# Manila midnight (16:00 UTC). The ritual: upgrade yesterday's Bitcoin proofs, seal
# tonight's decision journal (hash only), write the block, anchor on Base, stamp on
# Bitcoin, commit. Needs AIKIRI_GARDEN_TOKEN (read access to chiibitsu/aikiri-garden),
# AIKIRI_VALIDATOR_KEY and BASE_PRIVATE_KEY as repository secrets. The vault is checked
# out outside this repo and never committed here.
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: ledger-write
env:
  JOURNAL: 03_human/journal/decision-journal.md
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[bitcoin]"
      - name: check out the vault (outside the repo)
        uses: actions/checkout@v4
        with:
          repository: chiibitsu/aikiri-garden
          token: ${{ secrets.AIKIRI_GARDEN_TOKEN }}
          path: ../aikiri-garden
          sparse-checkout: ${{ env.JOURNAL }}
          sparse-checkout-cone-mode: false
      - name: upgrade pending Bitcoin proofs
        run: aikiri-ledger upgrade || true
      - name: seal the journal (hash only)
        run: |
          test -f "../aikiri-garden/$JOURNAL" || { echo "journal not found in vault"; exit 1; }
          aikiri-ledger seal "../aikiri-garden/$JOURNAL" --kind journal --ref "$JOURNAL"
          echo "VAULT_SHA=$(git -C ../aikiri-garden rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: block
        env:
          AIKIRI_VALIDATOR_KEY: ${{ secrets.AIKIRI_VALIDATOR_KEY }}
        run: |
          test -n "$AIKIRI_VALIDATOR_KEY" || { echo "secret AIKIRI_VALIDATOR_KEY is not set"; exit 1; }
          aikiri-ledger block --keyfile /nonexistent
          echo "INDEX=$(cut -d' ' -f1 ledger/HEAD)" >> "$GITHUB_ENV"
      - name: witness (Base anchor + OTS stamp)
        env:
          BASE_PRIVATE_KEY: ${{ secrets.BASE_PRIVATE_KEY }}
        run: |
          test -n "$BASE_PRIVATE_KEY" || { echo "secret BASE_PRIVATE_KEY is not set"; exit 1; }
          aikiri-ledger witness "$INDEX"
      - name: price the anchor in USD
        run: |
          python - <<'PY'
          import json, os, urllib.request
          p = f"ledger/blocks/{int(os.environ['INDEX']):06d}.base.json"
          d = json.load(open(p))
          try:
              r = json.load(urllib.request.urlopen("https://api.coinbase.com/v2/prices/ETH-USD/spot", timeout=20))
              d["ethUsdAtAnchor"] = float(r["data"]["amount"])
              d["feeUsd"] = round(d["totalWei"] / 1e18 * d["ethUsdAtAnchor"], 6)
          except Exception as e:
              d["ethUsdAtAnchor"] = None; d["feeUsd"] = None; print("price lookup failed:", e)
          open(p, "w").write(json.dumps(d, indent=2) + "\n")
          PY
      - name: commit block and proofs
        run: |
          B=$(printf "%06d" "$INDEX")
          HASH=$(python -c "import json;print(json.load(open('ledger/blocks/$B.json'))['hash'])")
          ROOT=$(python -c "import json;print(json.load(open('ledger/blocks/$B.json'))['roots'][0]['sha256'])")
          TX=$(python -c "import json;print(json.load(open('ledger/blocks/$B.base.json'))['tx'])")
          USD=$(python -c "import json;print(json.load(open('ledger/blocks/$B.base.json')).get('feeUsd'))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/HEAD ledger/blocks
          git rm -q --cached --ignore-unmatch ledger/queue.json
          git commit --author="Angeline S. Viray <chii@chiibitsu.com>" -F- <<MSG
          Block $INDEX

          hash     $HASH
          journal  $ROOT  ($JOURNAL @ $VAULT_SHA)
          Base     tx $TX  (\$$USD)
          OTS      pending; upgraded tomorrow night. Earlier proofs upgraded where complete.
          MSG
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: verify (chain, Base, Bitcoin)
        run: |
          for i in 1 2 3 4 5 6; do aikiri-ledger verify && exit 0; echo "retry $i"; sleep 10; done; exit 1
