name: nightly
# No longer writes anything. Blocks are written only when Chii approves a request
# on one of her devices, so there is nothing for a schedule to sign. What is left
# is worth doing nightly: fetch completed Bitcoin proofs, re-verify the whole
# chain against Base, and say plainly which of the four states it is in.
#
# A completed proof is not pushed to main directly. It is proposed as a pull
# request instead: this job's token can open a PR and push the branch behind
# it, but merging ~ the only thing that changes main ~ is Chii's click. The
# token still carries contents: write, because pushing that branch requires
# it; what changed is the workflow's own logic, which no longer contains a
# path that writes to main on its own. One persistent branch and PR is reused
# across nights rather than opening a new one each time a proof lands.
on:
  schedule:
    - cron: "0 16 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/nightly.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: ledger-write
jobs:
  witness:
    runs-on: ubuntu-latest
    environment: ledger-readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install, pinned by hash
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: upgrade pending Bitcoin proofs
        run: aikiri-ledger upgrade || true
      - name: propose any proof that completed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7.0.11
        with:
          add-paths: ledger/proofs
          commit-message: "Bitcoin proofs upgraded"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: nightly/bitcoin-proofs
          delete-branch: true
          title: "Bitcoin proofs upgraded"
          body: >
            OpenTimestamps proofs that finished stamping since the last run.
            Only ledger/proofs changes here; nothing else in this repository
            can be touched by this PR. Merging is the only step left ~ nothing
            in this workflow does it for you.
      - name: verify and report the state
        run: aikiri-ledger --trust trust.json verify --require local | tee -a "$GITHUB_STEP_SUMMARY"
