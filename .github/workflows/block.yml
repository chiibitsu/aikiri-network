name: block
# Writes the next block from a sealed request, anchors it on Base, stamps it on
# Bitcoin, commits the block and its proofs.
#
# The request is produced in the vault and pushed here as hashes only. It carries
# Chii's approval, signed in the Secure Enclave of one of her registered devices.
# This runner cannot produce that approval and cannot forge one: holding the
# validator key and the wallet key is not consent.
on:
  push:
    branches: [main]
    paths: ["ledger/requests/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: ledger-write
jobs:
  block:
    runs-on: ubuntu-latest
    environment: ledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install, pinned by hash
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: pinned solc
        run: |
          mkdir -p ~/.solcx
          curl -sSL -o ~/.solcx/solc-v0.8.26 \
            https://github.com/ethereum/solidity/releases/download/v0.8.26/solc-static-linux
          echo "d5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef  $HOME/.solcx/solc-v0.8.26" \
            | sha256sum -c -
          chmod +x ~/.solcx/solc-v0.8.26
      - name: reconcile any anchor whose receipt we never saw
        env:
          BASE_PRIVATE_KEY: ${{ secrets.BASE_PRIVATE_KEY }}
        run: aikiri-ledger reconcile
      - name: write the approved block
        env:
          AIKIRI_VALIDATOR_KEY: ${{ secrets.AIKIRI_VALIDATOR_KEY }}
        run: |
          test -n "$AIKIRI_VALIDATOR_KEY" || { echo "secret AIKIRI_VALIDATOR_KEY is not set"; exit 1; }
          aikiri-ledger block --keyfile /nonexistent
          echo "INDEX=$(cut -d' ' -f1 ledger/HEAD)" >> "$GITHUB_ENV"
      - name: witness on Base and Bitcoin
        env:
          BASE_PRIVATE_KEY: ${{ secrets.BASE_PRIVATE_KEY }}
        run: aikiri-ledger witness "$INDEX"
      - name: commit the block and its proofs
        run: |
          B=$(printf "%06d" "$INDEX")
          HASH=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['hash'])" "ledger/blocks/$B.json")
          ROOT=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['roots'][0]['sha256'])" "ledger/blocks/$B.json")
          KIND=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['roots'][0]['kind'])" "ledger/blocks/$B.json")
          DEV=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['approval']['device'])" "ledger/blocks/$B.json")
          TX=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['tx'])" "ledger/proofs/$B.base.json")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch ledger/requests/*.json
          git add ledger/HEAD ledger/blocks ledger/proofs
          git commit --author="Angeline S. Viray <chii@chiibitsu.com>" -F- <<MSG
          Block $INDEX

          hash      $HASH
          $KIND     $ROOT
          approved  $DEV
          Base      tx $TX
          OTS       pending; upgraded on a later run
          MSG
          git push origin HEAD:main
      - name: verify
        run: aikiri-ledger verify --trust trust.json --require local
